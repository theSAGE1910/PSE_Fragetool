# Start des ganzen Systems:   docker compose up --build        (/MK380/)
# Nur die Datenbank (für die Entwicklung):   docker compose up db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fragetool
      POSTGRES_USER: fragetool
      POSTGRES_PASSWORD: fragetool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragetool -d fragetool"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/fragetool
      DB_USER: fragetool
      DB_PASSWORD: fragetool
    ports:
      - "8080:8080"

volumes:
  pgdata:
